name: cohort7-frontend


on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code from repo
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js for React app
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci
      
      
      
      - name: Build React App
        run: npm run build
      
      
      - name: Build Docker Image
        run: |
          docker build -t myapp:${{ github.sha }} .
          docker save myapp:${{ github.sha }} > myapp.tar
      
     
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p /tmp/deploy
            
      
      - name: Copy Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "myapp.tar"
          target: "/tmp/deploy/"
      
      
      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to deployment directory
            cd /tmp/deploy
            
            # Stop existing container if running
            docker stop myapp || true
            docker rm myapp || true
            
            # Load new Docker image
            docker load < myapp.tar
            
            # after the deletion or an existing contain or creation of a new container
            docker run -d --name myapp -p 80:80 myapp:${{ github.sha }}
            
            # to remove the zipped file
            rm myapp.tar